name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version' 

    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Check formatting with ruff
      run: uv run ruff format --check .

  lint:
    name: Lint check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version' 

    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Lint with ruff
      run: uv run ruff check --output-format=github .

  type:
    name: Type check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version' 

    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Check type hints with ty
      run: uv run ty check src

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version' 

    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Test with pytest
      run: |
        uv run pytest
